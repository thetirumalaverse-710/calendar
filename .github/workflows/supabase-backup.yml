name: Daily Supabase Database Backup

on:
  schedule:
    # Run once daily at 02:00 UTC (07:30 IST)
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  backup:
    name: Backup Supabase Schema & Data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL Client Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Create Backup Directory
        run: |
          mkdir -p supabase/backups

      - name: Dump Database Schema & RLS Policies
        env:
          PGHOST: db.${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGDATABASE: postgres
        run: |
          pg_dump -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" --schema-only --no-owner -f supabase/backups/database.sql

      - name: Dump Database Table Data
        env:
          PGHOST: db.${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGDATABASE: postgres
        run: |
          pg_dump -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" --data-only --no-owner -f supabase/backups/data.sql

      - name: Compress Backup Files
        run: |
          TIMESTAMP=$(date -u +"%Y%m%d_%H%M%S")
          tar -czvf "supabase-backup-${TIMESTAMP}.tar.gz" -C supabase/backups database.sql data.sql
          echo "BACKUP_NAME=supabase-backup-${TIMESTAMP}.tar.gz" >> $GITHUB_ENV

      - name: Upload Backup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_NAME }}
          path: ${{ env.BACKUP_NAME }}
          retention-days: 30
